<!doctype html>
<!--
  Link preview image (shown when the site is shared on WhatsApp, Instagram,
  Facebook…). Regenerate it after changing the name, headline or hero photo:

  "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new --hide-scrollbars ^
    --window-size=1200,630 --virtual-time-budget=5000 ^
    --allow-file-access-from-files --screenshot=og.png scripts\og-image.html

  then save og.png as public/og-image.jpg (JPEG, under ~300 kB so WhatsApp shows it).
-->
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=block" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Geist", system-ui, sans-serif;
    background:
      linear-gradient(90deg, rgba(10, 8, 6, 0.92) 0%, rgba(10, 8, 6, 0.7) 50%, rgba(10, 8, 6, 0.2) 100%),
      url("../public/images/hero/slide-1-1600.jpg") center 50% / cover;
    color: #fff;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .logo { display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 600; letter-spacing: -0.02em; }
  h1 { font-size: 92px; font-weight: 600; letter-spacing: -0.045em; line-height: 1.02; max-width: 900px; }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: 28px; color: rgba(255,255,255,.75); border-top: 2px solid rgba(255,255,255,.2); padding-top: 32px; }
  .foot b { color: #fff; font-weight: 500; }
</style>
</head>
<body>
  <div class="logo">
    <svg width="52" height="52" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#E8580A"/><g fill="none" stroke="#0b0c0e" stroke-width="2.6" stroke-linecap="round"><path d="M7 9.5h18"/><path d="M7 16h4.2c2.2 0 2.6 3.6 4.8 3.6s2.6-3.6 4.8-3.6H25"/><path d="M7 23h18"/></g></svg>
    PDR Experts UAE
  </div>
  <h1>Mobile paintless dent repair in Dubai</h1>
  <div class="foot">
    <span>We come to you · Dubai &amp; Sharjah · 1–3 hours</span>
    <b>Free quote on WhatsApp</b>
  </div>
</body>
</html>
