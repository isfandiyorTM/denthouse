# Netlify build settings (these override the Netlify dashboard).
[build]
  # Runs vite build + prerender (full HTML for Google) + sitemap/robots.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed JS/CSS files never change — let browsers cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
